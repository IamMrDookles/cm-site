<header class="site-header">

  <div class="container header-inner">

    <a class="site-title" href="{{ "/" | relURL }}">
      {{ site.Title }}
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <ul>

        {{ range site.Menus.main }}

          <li>
            <a
              href="{{ .URL }}"
              {{ if $.IsMenuCurrent .Menu . }}
                class="active"
                aria-current="page"
              {{ end }}
            >
              {{ .Name }}
            </a>
          </li>

        {{ end }}

      </ul>
    </nav>

  </div>

</header>
