{{- $form := site.Params.contactform -}}
{{- if and $form.enabled $form.endpoint -}}
  <form class="contact-form" action="{{ $form.endpoint }}" method="post">
    <div class="contact-form__field">
      <label for="contact-name">Name</label>
      <input id="contact-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-email">Email</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-phone">Phone <span>(optional)</span></label>
      <input id="contact-phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <div class="contact-form__field contact-form__field--wide">
      <label for="contact-message">How can Ceri help?</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
    </div>
    <div class="contact-form__actions">
      <button class="button button--primary" type="submit">Send message</button>
    </div>
  </form>
{{- else }}
  <div class="component-placeholder component-placeholder--block">The contact form and privacy wording will be added here.</div>
{{- end }}
