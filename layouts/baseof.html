<!doctype html>
<html lang="{{ site.Language.Locale | default "en-GB" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {{ partial "header.html" . }}

  <main id="main-content" class="site-main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
