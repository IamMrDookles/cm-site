<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ if .IsHome }}
      {{ site.Title }}
    {{ else }}
      {{ .Title }} | {{ site.Title }}
    {{ end }}
  </title>

  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>

<body>

{{ partial "header.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ now.Year }} {{ site.Title }}</p>
    </div>
  </footer>

</body>
</html>
