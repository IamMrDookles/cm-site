{{ define "main" }}
  <article class="page">
    <header class="page-header">
      <div class="container narrow page-header__inner">
        {{- with .Params.eyebrow }}
          <p class="eyebrow">{{ . }}</p>
        {{- end }}

        <h1 class="page-title">{{ .Title }}</h1>

        {{- with .Params.intro }}
          <p class="page-intro">{{ . }}</p>
        {{- end }}
      </div>
    </header>

    <div class="page-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
