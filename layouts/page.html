{{ define "main" }}

<article class="page">

  <header class="page-header">
    <div class="container narrow">

      <h1>{{ .Title }}</h1>

      {{ with .Params.intro }}
        <p class="page-intro">{{ . }}</p>
      {{ end }}

    </div>
  </header>

  <div class="container narrow prose">
    {{ .Content }}
  </div>

</article>

{{ end }}
