- id: anxiety-stress
  title: "Anxiety & stress"
  summary: >-
    When your mind constantly feels switched on, it can be difficult to relax,
    sleep or enjoy everyday life. We can use CBT-informed techniques and
    psychological hypnotherapy to develop more helpful responses to anxious
    thoughts and situations.
  featured: true
  detailed: true

- id: confidence-self-esteem
  title: "Confidence & self-esteem"
  summary: >-
    Self-doubt can affect everything from relationships and work to social
    situations and the decisions you make. We can work on the thoughts and
    patterns that undermine your confidence and develop a more positive
    relationship with yourself.
  featured: true
  detailed: true

- id: fears-phobias
  title: "Fears & phobias"
  summary: >-
    Some fears can feel completely disproportionate to the situation, yet
    knowing that logically doesn't necessarily make them disappear.
    We can work on the thoughts, feelings and learned responses associated with
    particular fears and phobias.
  featured: true
  detailed: true

- id: unwanted-habits
  title: "Unwanted habits"
  summary: >-
    Habits can become automatic. Whether it's something you do when you're
    stressed, bored or tired, changing an established pattern can be difficult.
    We can explore what maintains the pattern and practise ways to interrupt it.
  featured: true
  detailed: true

- id: sleep
  title: "Sleep"
  summary: >-
    When your mind won't switch off, getting a good night's sleep can become a
    frustrating cycle. We can work on a calmer bedtime routine and the unhelpful
    thoughts and associations that may be affecting sleep.
  featured: true
  detailed: true

- id: weight-management
  title: "Weight management"
  summary: >-
    Sustainable weight management is about more than willpower. We can use
    psychological hypnotherapy alongside CBT-informed techniques to explore
    behaviours, habits and emotional triggers around food and support healthier choices.
  featured: false
  detailed: true

- id: exam-performance-anxiety
  title: "Exam & performance anxiety"
  summary: >-
    We can work on managing anxious thoughts and building a calmer, more focused
    response before exams, auditions, interviews and other high-pressure situations.
  featured: true
  detailed: false

- id: public-speaking
  title: "Public speaking"
  summary: >-
    We can work with the thoughts and physical responses that can make speaking in
    front of others feel overwhelming, and build confidence for presentations
